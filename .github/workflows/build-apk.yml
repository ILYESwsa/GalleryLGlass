name: Build debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble Gallery L Glass APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GRADLE_VERSION: '8.7'

    steps:
      - name: Checkout Gallery L Glass
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: GalleryLGlass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
